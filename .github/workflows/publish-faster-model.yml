name: Prepare Faster R-CNN release
on:
  workflow_dispatch:
  push:
    branches: [feat/m2-detection-quality]
    paths: [.github/workflows/publish-faster-model.yml]
permissions:
  contents: read
concurrency:
  group: models-faster-rcnn-v1
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TORCH_HOME: /tmp/ia-faster-torch
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-vision.txt
      - run: mkdir -p .vision-data && python scripts/export-faster.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faster-model
          path: |
            public/models/faster-rcnn/model-*.bin
            public/models/faster-rcnn/manifest.json
            public/models/faster-rcnn/torchvision-LICENSE.txt
          if-no-files-found: error
          retention-days: 1
  draft-release:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: faster-model
          path: model
      - name: Create draft with model files only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL_COMMIT: ${{ github.sha }}
        run: |
          gh release create models-faster-rcnn-v1 \
            model/model-*.bin model/manifest.json model/torchvision-LICENSE.txt \
            --draft --target "$MODEL_COMMIT" \
            --title 'Faster R-CNN COCO V1 — poids navigateur ONNX' \
            --notes 'Poids officiels torchvision COCO_V1, ONNX opset 17. Neuf parties, manifeste SHA-256 et licence. Brouillon en attente de téléchargement vérifié et de recette navigateur avant publication. Aucune photographie.'
